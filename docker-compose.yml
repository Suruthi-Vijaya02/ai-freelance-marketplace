services:
  mongodb:
    image: mongo:7
    container_name: svr-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: svr-redis
    ports:
      - '6379:6379'
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: svr-server
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/suruthi-viaya-r
      REDIS_URL: redis://redis:6379
      JWT_SECRET: docker-dev-secret
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: svr-client
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
